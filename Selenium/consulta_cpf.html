<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Consulta - Ambiente de Treinamento</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f5; margin: 0; padding: 40px; color: #222; }
    .caixa { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #dcdfe2; border-radius: 8px; padding: 28px 32px; }
    h1 { font-size: 20px; color: #2e6e62; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: #666; font-size: 13px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid #b9bfc4; border-radius: 5px; }
    button { margin-top: 16px; background: #2e6e62; color: #fff; border: none; padding: 11px 22px; font-size: 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #255a50; }
    #resultado { margin-top: 24px; font-size: 14px; min-height: 24px; }
    .carregando { color: #888; font-style: italic; }
    .registro { background: #eef6f4; border: 1px solid #cfe4df; border-radius: 6px; padding: 14px 16px; }
    .registro div { margin: 3px 0; }
    .erro { color: #b03030; }
    .rotulo { font-weight: bold; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>Sistema de Consulta</h1>
    <p class="sub">Ambiente de treinamento. Dados fictícios, sem qualquer relação com pessoas reais.</p>

    <label for="cpf">CPF (somente números)</label>
    <input type="text" id="cpf" placeholder="Digite um CPF de teste">

    <button id="consultar">Consultar</button>

    <div id="resultado"></div>
  </div>

  <script>
    // Base fictícia de treinamento. CPFs sem pontuação.
    var base = {
      "11111111111": { nome: "Marcelo Manuel",  categoria: "B", situacao: "Regular" },
      "22222222222": { nome: "Aluno de Teste",  categoria: "AB", situacao: "Pendente" },
      "33333333333": { nome: "Flavia Duraes",   categoria: "A", situacao: "Regular" }
    };

    document.getElementById("consultar").addEventListener("click", function () {
      var cpf = document.getElementById("cpf").value.replace(/\D/g, "");
      var alvo = document.getElementById("resultado");
      alvo.innerHTML = '<span class="carregando">Consultando...</span>';

      // Atraso proposital para praticar espera explicita (WebDriverWait).
      setTimeout(function () {
        var reg = base[cpf];
        if (reg) {
          alvo.innerHTML =
            '<div class="registro" id="registro">' +
              '<div><span class="rotulo">Nome:</span> ' + reg.nome + '</div>' +
              '<div><span class="rotulo">Categoria:</span> ' + reg.categoria + '</div>' +
              '<div><span class="rotulo">Situacao:</span> ' + reg.situacao + '</div>' +
            '</div>';
        } else {
          alvo.innerHTML = '<div class="erro" id="registro">Nenhum registro encontrado para o CPF informado.</div>';
        }
      }, 1200);
    });
  </script>
</body>
</html>
